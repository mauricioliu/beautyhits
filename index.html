<!DOCTYPE html>
<!--
  PROTOTYPE — BeautyHits variant switcher (throwaway).
  Three radically different homepage directions, switchable via ?variant=a|b|c.
  Each variant is a self-contained page in /variants. This shell just frames them + a floating switch bar.
-->
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>BeautyHits — Prototipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;font-family:'Syne',system-ui,sans-serif}
#stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}

.switch{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;
  display:flex;align-items:center;gap:4px;padding:6px;border-radius:50px;
  background:rgba(14,12,16,.82);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.5);
  color:#fff;user-select:none}
.switch__arrow{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-size:1.1rem;
  background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;transition:.2s}
.switch__arrow:hover{background:#d8a86b;color:#1a1410}
.switch__label{padding:0 16px;min-width:178px;text-align:center}
.switch__key{font-weight:800;font-size:.8rem;letter-spacing:.1em}
.switch__name{display:block;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:#b3a99c;margin-top:2px}
.switch__dots{display:flex;gap:5px;margin-left:6px;padding-right:4px}
.switch__dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:.2s}
.switch__dots i.on{background:#d8a86b;width:18px;border-radius:6px}
.switch__hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:99;color:rgba(255,255,255,.4);
  font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.tag{position:fixed;top:0;left:0;z-index:99;background:#df2c12;color:#fff;font-size:.56rem;letter-spacing:.18em;
  text-transform:uppercase;font-weight:700;padding:5px 12px;border-bottom-right-radius:10px;pointer-events:none}
</style>
</head>
<body>
<span class="tag">Prototipo · BeautyHits</span>
<iframe id="stage" title="BeautyHits variant"></iframe>

<div class="switch">
  <button class="switch__arrow" id="prev" aria-label="Anterior">‹</button>
  <div class="switch__label">
    <span class="switch__key" id="vKey">A</span>
    <span class="switch__name" id="vName">Salon</span>
  </div>
  <button class="switch__arrow" id="next" aria-label="Siguiente">›</button>
  <div class="switch__dots" id="dots"></div>
</div>
<div class="switch__hint">← → para cambiar de diseño</div>

<script>
const VARIANTS=[
  {key:'a',name:'Salon · minimal',file:'variants/a.html'},
  {key:'b',name:'Editorial · revista',file:'variants/b.html'},
  {key:'c',name:'Noir Chrome · luxe',file:'variants/c.html'},
  {key:'d',name:'Drop · DTC (DropBe)',file:'variants/d.html'},
  {key:'e',name:'Quiz · finder (DropBe)',file:'variants/e.html'},
  {key:'f',name:'Pop · sticker (DropBe)',file:'variants/f.html'},
  {key:'g',name:'Blush · rosa (imagen)',file:'variants/g.html'},
  {key:'h',name:'Glam Pop · negro/magenta (imagen)',file:'variants/h.html'},
  {key:'i',name:'Blush Glam · rosa suave (imagen)',file:'variants/i.html'},
  {key:'j',name:'Bay · Gen-Z pop (BeautyBay)',file:'variants/j.html'},
  {key:'k',name:'Cult · curaduría (CultBeauty)',file:'variants/k.html'},
  {key:'l',name:'NK · calma pastel (SpaceNK)',file:'variants/l.html'},
  {key:'m',name:'Niche · minimal (NicheBeauty)',file:'variants/m.html'},
];
const stage=document.getElementById('stage');
const dotsWrap=document.getElementById('dots');
VARIANTS.forEach(()=>{const i=document.createElement('i');dotsWrap.appendChild(i);});
const dots=[...dotsWrap.children];

function idxFromUrl(){
  const v=(new URLSearchParams(location.search).get('variant')||'a').toLowerCase();
  const i=VARIANTS.findIndex(x=>x.key===v);return i<0?0:i;
}
let cur=idxFromUrl();
function render(){
  const v=VARIANTS[cur];
  stage.src=v.file;
  document.getElementById('vKey').textContent=v.key.toUpperCase();
  document.getElementById('vName').textContent=v.name;
  dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
  const u=new URL(location.href);u.searchParams.set('variant',v.key);history.replaceState({},'',u);
}
function go(d){cur=(cur+d+VARIANTS.length)%VARIANTS.length;render();}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='ArrowRight')go(1);
});
render();
</script>
</body>
</html>
